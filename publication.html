<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydraulic Lift Publication | Meghana</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background: #f8fafc;
            color: #1e293b;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .publication-files {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
        }

        .file-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .file-card img {
            width: 100%;
            height: 260px;
            object-fit: contain;
            border-radius: 8px;
        }

        .file-card h3 {
            margin: 12px 0;
        }

        .view-button {
            display: inline-block;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .pdf-icon {
            font-size: 70px;
            padding: 75px 0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <h1>Hydraulic Lift Publication</h1>
    <p class="subtitle">NCTCT-2025 | Certificate and Publication Photos</p>

    <div class="publication-files">

        <div class="file-card">
            <div class="pdf-icon">📄</div>
            <h3>Publication Certificate</h3>
            <a class="view-button"
               href="https://github.com/Meghana-9934/Meghana-portfolio/blob/main/publication-certificate.pdf"
               target="_blank" rel="noopener noreferrer">
                View Certificate
            </a>
        </div>

        <div class="file-card">
            <img src="https://raw.githubusercontent.com/Meghana-9934/Meghana-portfolio/main/publication-photo1.jpeg"
                 alt="Publication Photo 1">
            <h3>Publication Photo 1</h3>
            <a class="view-button"
               href="https://raw.githubusercontent.com/Meghana-9934/Meghana-portfolio/main/publication-photo1.jpeg"
               target="_blank" rel="noopener noreferrer">
                View Photo
            </a>
        </div>

        <div class="file-card">
            <img src="https://raw.githubusercontent.com/Meghana-9934/Meghana-portfolio/main/publication-photo2.jpeg"
                 alt="Publication Photo 2">
            <h3>Publication Photo 2</h3>
            <a class="view-button"
               href="https://raw.githubusercontent.com/Meghana-9934/Meghana-portfolio/main/publication-photo2.jpeg"
               target="_blank" rel="noopener noreferrer">
                View Photo
            </a>
        </div>

        <div class="file-card">
            <img src="https://raw.githubusercontent.com/Meghana-9934/Meghana-portfolio/main/publication-photo3.jpeg"
                 alt="Publication Photo 3">
            <h3>Publication Photo 3</h3>
            <a class="view-button"
               href="https://raw.githubusercontent.com/Meghana-9934/Meghana-portfolio/main/publication-photo3.jpeg"
               target="_blank" rel="noopener noreferrer">
                View Photo
            </a>
        </div>

    </div>

    <a class="back-link" href="index.html">← Back to Portfolio</a>

</body>
</html>
